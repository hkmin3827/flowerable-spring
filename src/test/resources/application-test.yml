# src/test/resources/application-test.yml
spring:
  config:
    import: ""  # AWS Parameter Store 로드 방지 (중요!)

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      -
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# AWS 관련 자동 설정이 로컬에서 돌지 않게 비활성화
cloud:
  aws:
    stack:
      auto: false
    region:
      static: ap-northeast-2
    credentials:
      instance-profile: false

logging:
  slack:
    config: classpath:logback-spring.xml
    execution-time-log-webhook-uri: http://dummy-url.com
    error-log-webhook-uri: http://dummy-url.com